        },
        {

            description: 'Collabify is a dedicated marketplace platform that bridges the gap between talented artists and brands seeking creative collaboration. The platform empowers artists to build professional profiles, showcase portfolios, and actively bid on brand opportunities—while giving brands a curated space to discover the perfect creative talent for their campaigns.',

    let currentCardIndex = 0;

    // Generate cards
    caseStudies.forEach((study, index) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.dataset.index = index;

        if (study.type === 'cta') {
            card.innerHTML = `
                <div class="max-w-7xl mx-auto w-full px-6 lg:px-8">

                            Start Your Project →
                        </a>
                    </div>
                </div>
            `;
        } else {
            const style = cardStyles[index % cardStyles.length];

            // Pattern HTML based on type
            let patternHTML = '';
            if (style.pattern === 'diagonal-grid') {
                patternHTML = '<div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(0,0,0,0.4) 35px, rgba(0,0,0,0.4) 40px), repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(0,0,0,0.4) 35px, rgba(0,0,0,0.4) 40px);"></div>';
            } else if (style.pattern === 'grid') {
                patternHTML = '<div class="absolute inset-0 opacity-10" style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 40px 40px;"></div>';
            } else if (style.pattern === 'dots') {
                patternHTML = '<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 20px 20px;"></div>';
            } else if (style.pattern === 'lines') {
                patternHTML = '<div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.1) 10px, rgba(255,255,255,0.1) 20px);"></div>';
            } else if (style.pattern === 'mesh') {
                patternHTML = '<div class="absolute inset-0 opacity-10" style="background-image: linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px;"></div>';
            } else if (style.pattern === 'circles') {
                patternHTML = '<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.1) 2%, transparent 0%), radial-gradient(circle at 75% 75%, rgba(255,255,255,0.1) 2%, transparent 0%); background-size: 50px 50px;"></div>';
            }

            // Check if this is a light background (Vapix or Prospera)
            const isLightBg = index === 2 || index === 3; // Vapix (2) and Prospera (3)
            const textColor = isLightBg ? 'text-gray-900' : 'text-white';
            const subtitleColor = isLightBg ? 'text-gray-700' : 'text-gray-300';

            // Custom button gradients for each project
            let buttonGradient = 'bg-gradient-to-r from-purple-600 to-blue-600';
            if (index === 2) buttonGradient = 'bg-gradient-to-r from-red-600 to-red-500'; // Vapix - Red
            if (index === 3) buttonGradient = 'bg-gradient-to-r from-green-600 to-emerald-600'; // Prospera - Green

            // Different image layouts based on card
            let imageLayout = '';
            if (study.layout === 'default') {
                // Standard floating phones
                imageLayout = `
                    <div class="phone-mockup phone-center absolute">
                        <img src="${study.images[0]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-2xl">
                    </div>
                    <div class="phone-mockup phone-left absolute">
                        <img src="${study.images[1]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                    </div>
                    <div class="phone-mockup phone-right absolute">
                        <img src="${study.images[2]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                    </div>
                `;
            } else if (study.layout === 'stacked') {
                // Vertically stacked phones
                imageLayout = `
                    <div class="absolute left-1/2 top-1/4 -translate-x-1/2 z-30">
                        <div class="phone-mockup">
                            <img src="${study.images[0]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-2xl">
                        </div>
                    </div>
                    <div class="absolute left-1/4 top-1/2 -translate-y-1/2 z-20 opacity-70">
                        <div class="phone-mockup scale-75">
                            <img src="${study.images[1]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                        </div>
                    </div>
                    <div class="absolute right-1/4 top-2/3 -translate-y-1/2 z-10 opacity-60">
                        <div class="phone-mockup scale-75">
                            <img src="${study.images[2]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                        </div>
                    </div>
                `;
            } else if (study.layout === 'grid') {
                // Grid layout
                imageLayout = `
                    <div class="grid grid-cols-2 gap-4 place-items-center h-full">
                        <div class="phone-mockup scale-90">
                            <img src="${study.images[0]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                        </div>
                        <div class="phone-mockup scale-90">
                            <img src="${study.images[1]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                        </div>
                    </div>
                `;
            } else if (study.layout === 'overlap') {
                // Overlapping design
                imageLayout = `
                    <div class="absolute left-1/4 top-1/2 -translate-y-1/2 z-10 rotate-[-8deg]">
                        <div class="phone-mockup scale-90">
                            <img src="${study.images[0]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-2xl">
                        </div>
                    </div>
                    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-30">
                        <div class="phone-mockup">
                            <img src="${study.images[1]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-2xl">

                    </div>
                    <div class="absolute right-1/4 top-1/2 -translate-y-1/2 z-20 rotate-[8deg]">
                        <div class="phone-mockup scale-90">

                `;
            } else if (study.layout === 'carousel') {
                // Carousel style
                imageLayout = `
                    <div class="absolute left-0 top-1/2 -translate-y-1/2 z-10 opacity-50 scale-75">
                        <div class="phone-mockup">
                            <img src="${study.images[0]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">

                    </div>
                    <div class="absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-30">

                            <img src="${study.images[1]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-2xl">

                        ${style.decorations}
                        <div class="grid lg:grid-cols-2 gap-8 lg:gap-12 items-center p-8 lg:p-16 relative z-10">
                            <div class="order-2 lg:order-1">
                                <div class="inline-block px-3 py-1 bg-white/10 backdrop-blur rounded-full text-xs ${textColor} font-semibold mb-4">${study.category}</div>
                                <h3 class="text-3xl lg:text-5xl font-black ${textColor} mb-4 leading-tight">${study.title}</h3>
                                <p class="text-base lg:text-lg ${subtitleColor} mb-6 leading-relaxed">${study.description}</p>
                                <a href="${study.link}" class="inline-flex items-center px-8 py-4 ${buttonGradient} text-white rounded-xl font-bold hover:scale-105 transition-all shadow-lg">
                                    Read case study →
                                </a>
                            </div>
                            <div class="phone-mockups-container relative h-[400px] lg:h-[500px] order-1 lg:order-2">
                                ${imageLayout}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        container.appendChild(card);
    });

    const cards = document.querySelectorAll('.project-card');
    const scrollContainer = document.querySelector('.scroll-container');

    // Set initial states and z-index for stacking
    cards.forEach((card, index) => {
        card.style.zIndex = index; // Higher index = on top

        if (index === 0) {
            // First card visible
            gsap.set(card, { yPercent: 0 });
            card.classList.add('active');
        } else {
            // Other cards start below viewport
            gsap.set(card, { yPercent: 100 });
        }
    });

    // Create scroll-linked overlapping animation for each card
    cards.forEach((card, index) => {
        if (index === 0) return; // Skip first card

        const cardScrollSpace = 100 / cards.length; // Each card gets equal scroll space
        const startProgress = (index - 1) * cardScrollSpace;
        const endProgress = index * cardScrollSpace;

        // Animate card sliding up to overlap previous card
        gsap.to(card, {
            yPercent: 0,
            ease: 'none',
            scrollTrigger: {
                trigger: scrollContainer,
                start: `top+=${startProgress}% top`,
                end: `top+=${endProgress}% top`,
                scrub: 1, // Tied directly to scroll position
                onEnter: () => card.classList.add('active'),
                onLeaveBack: () => card.classList.remove('active')
            }
        });
    });
});
</script>
