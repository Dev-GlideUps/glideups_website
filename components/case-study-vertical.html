                    yPercent: 0,
                    force3D: true,
                    immediateRender: true,
                    transformOrigin: 'center center'
                });
                card.classList.add('active');
            } else {
                gsap.set(card, {
                    yPercent: 100,
                    force3D: true,
                    immediateRender: true,
                    transformOrigin: 'center center'
                });
            }
        });

        // Wait for images, then setup animations
        this.waitForImagesAndAnimate(cards, scrollContainer);
    },

    waitForImagesAndAnimate: function(cards, scrollContainer) {
        const images = $('#cards-container img');
        let imagesLoaded = 0;
        const totalImages = images.length;
        const self = this;

        function checkAllLoaded() {
            imagesLoaded++;
            if (imagesLoaded >= totalImages) {
                self.setupScrollAnimations(cards, scrollContainer);
                self.markAsReady();
            }
        }

        if (totalImages === 0) {
            this.setupScrollAnimations(cards, scrollContainer);
            this.markAsReady();
        } else {
            images.each(function() {
                if (this.complete) {
                    checkAllLoaded();
                } else {
                    $(this).on('load error', checkAllLoaded);
                }
            });

            // Fallback
            setTimeout(() => {
                if (imagesLoaded < totalImages) {
                    self.setupScrollAnimations(cards, scrollContainer);
                    self.markAsReady();
                }
            }, 1500);
        }
    },

    markAsReady: function() {
        $('.case-studies-section')
            .removeClass('case-studies-loading')
            .addClass('case-studies-ready');
    },

    setupScrollAnimations: function(cards, scrollContainer) {
        const isMobile = this.isMobile;

        // Configure ScrollTrigger for better mobile performance
        ScrollTrigger.config({
            autoRefreshEvents: "visibilitychange,DOMContentLoaded,load",
            limitCallbacks: true,
            syncInterval: isMobile ? 100 : 16,
            ignoreMobileResize: true
        });

        // Force initial render and refresh
        requestAnimationFrame(() => {
            ScrollTrigger.refresh();
        });

        // Create scroll-linked overlapping animation for each card
        cards.each(function(index) {
        const card = this;
        const $card = $(card);

        if (index === 0) return; // Skip first card

        const cardScrollSpace = 100 / cards.length; // Each card gets equal scroll space
        const startProgress = (index - 1) * cardScrollSpace;
        const endProgress = index * cardScrollSpace;

        // Animate card sliding up to overlap previous card
        gsap.to(card, {
            yPercent: 0,
            force3D: true,
            ease: isMobile ? 'power3.out' : 'none',
            scrollTrigger: {
                trigger: scrollContainer,
                start: `top+=${startProgress}% top`,
                end: `top+=${endProgress}% top`,
                scrub: isMobile ? 2.5 : 1, // Very smooth on mobile
                invalidateOnRefresh: true,
                anticipatePin: 1,
                fastScrollEnd: true,
                normalizeScroll: isMobile,
                ignoreMobileResize: true,
                onEnter: () => {
                    $card.addClass('active');
                    // Force hardware acceleration
                    if (isMobile) {
                        requestAnimationFrame(() => {
                            card.style.transform = card.style.transform + ' translateZ(0)';
                        });
                    }

                    // Restart rocket and title animations for CTA card
                    if (index === cards.length - 1) {
                        const $rocketIcon = $card.find('.rocket-icon');
                        const $ctaTitle = $card.find('.cta-title');

                        if ($rocketIcon.length) {
                            $rocketIcon.css('animation', 'none');
                            setTimeout(() => {
                                $rocketIcon.css('animation', 'rocketTakeoff 1.8s ease-out forwards');
                            }, 10);
                        }

                        if ($ctaTitle.length) {
                            $ctaTitle.css('animation', 'none');
                            setTimeout(() => {
                                $ctaTitle.css({
                                    'animation': 'slideInUp 1s ease-out 0.3s forwards',
                                    'opacity': '0'
                                });
                            }, 10);
                        }
                    }
                },
                onLeaveBack: () => $card.removeClass('active')
            }
        });
        });

        // Final refresh after animations are set up
        setTimeout(() => {
            ScrollTrigger.refresh();
        }, 100);
    }
};

// Initialize IMMEDIATELY when script loads (not waiting for DOM ready)
$(document).ready(function() {
    CaseStudyBuilder.init();
});

// Refresh ScrollTrigger on resize with debounce
let resizeTimer;
$(window).on('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        ScrollTrigger.refresh();
    }, 250);
});

// Final refresh after window fully loads
$(window).on('load', function() {
    setTimeout(() => {
        ScrollTrigger.refresh();
    }, 100);
});
</script>
