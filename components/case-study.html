    <div class="container mx-auto px-4 lg:px-8 xl:px-12 relative z-10">
        <!-- Section Title -->
        <h2 class="text-3xl sm:text-4xl lg:text-5xl xl:text-[52px] font-semibold leading-tight lg:leading-[60px] tracking-[-1px] sm:tracking-[-1.92px] text-center mb-8 sm:mb-12 lg:mb-14">
            Our Success <span class="text-primary">Stories</span>
        </h2>

        <!-- 3D Coverflow Carousel -->
        <div class="relative pb-16 sm:pb-18 lg:pb-20" id="coverflow-wrapper" style="perspective: 2000px; perspective-origin: center;">
            <!-- Navigation Arrows -->
            <button id="coverflow-prev" class="flex absolute left-2 sm:left-4 lg:left-12 xl:left-16 top-1/2 -translate-y-1/2 z-30 w-10 h-10 sm:w-12 sm:h-12 lg:w-14 lg:h-14 bg-primary hover:bg-primary-dark text-white rounded-full items-center justify-center shadow-lg transition-all duration-300 opacity-90 hover:opacity-100 hover:scale-110">
                <svg class="w-5 h-5 lg:w-6 lg:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <button id="coverflow-next" class="flex absolute right-2 sm:right-4 lg:right-12 xl:right-16 top-1/2 -translate-y-1/2 z-30 w-10 h-10 sm:w-12 sm:h-12 lg:w-14 lg:h-14 bg-primary hover:bg-primary-dark text-white rounded-full items-center justify-center shadow-lg transition-all duration-300 opacity-90 hover:opacity-100 hover:scale-110">
                <svg class="w-5 h-5 lg:w-6 lg:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
            </button>

            <!-- Progress Indicator -->
            <div id="coverflow-progress" class="absolute bottom-4 sm:bottom-6 lg:bottom-8 left-1/2 -translate-x-1/2 z-20 flex gap-2 lg:gap-3"></div>

            <!-- Coverflow Container -->
            <div class="relative h-[350px] sm:h-[420px] lg:h-[480px] xl:h-[520px] flex items-center justify-center overflow-visible" id="coverflow-container" style="transform-style: preserve-3d; will-change: transform;">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Background Layer -->
    <div class="absolute inset-0 -z-10 bg-gray-50 rounded-3xl"></div>
</section>

<!-- CSS Styles for 3D Coverflow -->
<style>
/* Section styling with blurred background */
#case-study-section {
    position: relative;
    isolation: isolate;
}

.coverflow-card {
    position: absolute;
    width: 280px;
    height: 380px;
    border-radius: 24px;
    overflow: hidden;
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    backface-visibility: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    will-change: transform;
}

.coverflow-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@media (min-width: 640px) {
    .coverflow-card {
        width: 320px;
        height: 420px;
    }
}

@media (min-width: 1024px) {
    .coverflow-card {
        width: 400px;
        height: 520px;
    }
}

@media (min-width: 1280px) {
    .coverflow-card {
        width: 420px;
        height: 560px;
    }
}

.coverflow-card.active {
    z-index: 10;
    transform: translate3d(0, 0, 0) scale(1.05);
    filter: none;
    box-shadow: 0 25px 70px rgba(29, 191, 115, 0.3), 0 10px 30px rgba(0, 0, 0, 0.4);
}

.coverflow-card.left-1 {
    z-index: 9;
    transform: translate3d(-45%, 0, -80px) rotateY(30deg) scale(0.88);
    filter: brightness(0.88);
}

.coverflow-card.left-2 {
    z-index: 8;
    transform: translate3d(-85%, 0, -150px) rotateY(40deg) scale(0.78);
    filter: brightness(0.75);
    opacity: 0.6;
}

.coverflow-card.right-1 {
    z-index: 9;
    transform: translate3d(45%, 0, -80px) rotateY(-30deg) scale(0.88);
    filter: brightness(0.88);
}

.coverflow-card.right-2 {
    z-index: 8;
    transform: translate3d(85%, 0, -150px) rotateY(-40deg) scale(0.78);
    filter: brightness(0.75);
    opacity: 0.6;
}

/* Desktop optimizations */
@media (min-width: 1024px) {
    .coverflow-card.active {
        transform: none;
    }

    .coverflow-card.left-1 {
        transform: translate3d(-18%, 0, -80px) rotateY(40deg) scale(0.92);
    }

    .coverflow-card.left-2 {
        transform: translate3d(-32%, 0, -150px) rotateY(50deg) scale(0.82);
        opacity: 0.5;
    }

    .coverflow-card.right-1 {
        transform: translate3d(18%, 0, -80px) rotateY(-40deg) scale(0.92);
    }

    .coverflow-card.right-2 {
        transform: translate3d(32%, 0, -150px) rotateY(-50deg) scale(0.82);
        opacity: 0.5;
    }
}

@media (min-width: 1280px) {
    .coverflow-card.active {
        transform: none;
    }

    .coverflow-card.left-1 {
        transform: translate3d(-16%, 0, -80px) rotateY(42deg) scale(0.90);
    }

    .coverflow-card.left-2 {
        transform: translate3d(-28%, 0, -150px) rotateY(52deg) scale(0.80);
        opacity: 0.4;
    }

    .coverflow-card.right-1 {
        transform: translate3d(16%, 0, -80px) rotateY(-42deg) scale(0.90);
    }

    .coverflow-card.right-2 {
        transform: translate3d(28%, 0, -150px) rotateY(-52deg) scale(0.80);
        opacity: 0.4;
    }
}

.coverflow-card.hidden {
    opacity: 0;
    pointer-events: none;
}

.coverflow-card-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 20%;
    background: rgba(255, 255, 255, 0.95);
}

.coverflow-progress-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #d1d5db;
    cursor: pointer;
    transition: all 0.3s;
}

.coverflow-progress-dot.active {
    background: #1dbf73;
    width: 32px;
    border-radius: 5px;
}

@media (min-width: 1024px) {
    .coverflow-progress-dot {
        width: 12px;
        height: 12px;
    }

    .coverflow-progress-dot.active {
        width: 40px;
        border-radius: 6px;
    }
}

@media (max-width: 640px) {
    .coverflow-card.left-1 {
        transform: translate3d(-35%, 0, -100px) rotateY(22deg) scale(0.88);
    }

    .coverflow-card.right-1 {
        transform: translate3d(35%, 0, -100px) rotateY(-22deg) scale(0.88);
    }

    .coverflow-card.left-2,
    .coverflow-card.right-2 {
        opacity: 0;
        pointer-events: none;
    }

    .coverflow-card.active {
        transform: translate3d(0, 0, 0) scale(1);
    }
}
</style>

<!-- GSAP Scripts and Coverflow Logic -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Case Study Data
    const caseStudies = [
       
         {
            id: 'myshare',
            title: 'My Share',
            subtitle: 'Fitness Tracking & Wellness',
            category: 'Health & Fitness',
            image: './assets/casestudy/myshare/cs1.svg',
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-myshare.php'
        },
        {
            id: 'vapix',
            title: 'Vapix',
            subtitle: 'Smart Shopping Experience',
            category: 'E-Commerce',
            image: 'https://res.cloudinary.com/dvf7uywcp/image/upload/v1767167693/cs2_xbaq4l.svg',
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-nimbus.php'
        },

         {
            id: 'artify',
            title: 'Artify',
            subtitle: 'Digital Art Marketplace',
            category: 'Social',
            image: './assets/casestudy/artify/csh5.svg',
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-detail.php'
        },
       
        {
            id: 'prospera',
            title: 'Prospera',
            subtitle: 'Carbon Registry Platform',
            category: 'CleanTech',
            image: './assets/casestudy/prospera/cs5.svg',
            tags: ['Web App', 'React', 'Node.js'],
            link: './case-studies/case-study-prospera.php'
        },
        {
            id: 'collabify',
            title: 'Collabify',
            subtitle: 'Team Collaboration Platform',
            category: 'Social',
            image: './assets/home/cs5.svg',
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-collabify.php'
        },
        {
            id: 'cta',
            type: 'cta',
            title: 'Your App Idea Starts Here',
            description: 'Join 50+ businesses that launched successful mobile apps with GlideUps',
            image: './assets/cta-vector.svg',
            link: '#contact-section'
        }
    ];

    const container = document.getElementById('coverflow-container');
    const progressContainer = document.getElementById('coverflow-progress');
    const prevBtn = document.getElementById('coverflow-prev');
    const nextBtn = document.getElementById('coverflow-next');

    let currentIndex = 2; // Start with third item (My Share)
    const totalCards = caseStudies.length;

    // Create Cards
    caseStudies.forEach((study, index) => {
        const card = document.createElement(study.type === 'cta' ? 'div' : 'a');
        card.className = 'coverflow-card';
        card.dataset.index = index;

        if (study.type === 'cta') {
            // CTA Card
            card.innerHTML = `
                <div class="w-full h-full border-2 border-primary border-dashed p-6 lg:p-8 flex flex-col items-center justify-center text-center bg-white">
                    <img src="${study.image}" alt="${study.title}" class="w-32 h-32 lg:w-40 lg:h-40 mb-4">
                    <h4 class="text-xl lg:text-2xl font-semibold mb-3">${study.title}</h4>
                    <p class="text-gray text-sm mb-4 px-4">${study.description}</p>
                    <a href="${study.link}" class="border-2 border-primary text-primary bg-transparent hover:bg-primary hover:text-white px-6 py-2 rounded-full transition-all duration-300">Get Free Quote</a>
                </div>
            `;
        } else {
            // Case Study Card
            card.href = study.link;
            card.innerHTML = `
                <img src="${study.image}" alt="${study.title}" class="w-full h-full object-cover">
                <div class="coverflow-card-gradient"></div>
                <div class="absolute top-4 left-4">
                    <span class="bg-primary text-white text-xs font-semibold px-3 py-1 rounded-full">${study.category}</span>
                </div>
                <div class="absolute bottom-0 left-0 right-0 z-10 px-4 py-3 flex items-center justify-between">
                    <div class="flex-1">
                        <h4 class="text-gray-900 text-lg lg:text-xl font-bold mb-0.5 leading-tight">${study.title}</h4>
                        <p class="text-gray-700 text-xs lg:text-sm font-medium leading-tight">${study.subtitle}</p>
                    </div>
                    <span class="w-8 h-8 lg:w-10 lg:h-10 rounded-full bg-primary flex items-center justify-center flex-shrink-0 ml-2">
                        <img src="./assets/arrow-up.svg" alt="" class="w-4 h-4 lg:w-5 lg:h-5 rotate-90 brightness-0 invert">
                    </span>
                </div>
            `;
        }

        // Click to navigate
        card.addEventListener('click', (e) => {
            if (index !== currentIndex && study.type !== 'cta') {
                e.preventDefault();
                currentIndex = index;
                updateCarousel();
            }
        });

        container.appendChild(card);
    });

    // Create Progress Dots
    for (let i = 0; i < totalCards; i++) {
        const dot = document.createElement('div');
        dot.className = 'coverflow-progress-dot';
        dot.dataset.index = i;
        dot.addEventListener('click', () => {
            currentIndex = i;
            updateCarousel();
        });
        progressContainer.appendChild(dot);
    }

    const cards = container.querySelectorAll('.coverflow-card');
    const dots = progressContainer.querySelectorAll('.coverflow-progress-dot');

    function updateCarousel() {
        cards.forEach((card, index) => {
            card.classList.remove('active', 'left-1', 'left-2', 'right-1', 'right-2', 'hidden');

            const diff = index - currentIndex;

            if (diff === 0) {
                card.classList.add('active');
            } else if (diff === -1) {
                card.classList.add('left-1');
            } else if (diff === -2) {
                card.classList.add('left-2');
            } else if (diff === 1) {
                card.classList.add('right-1');
            } else if (diff === 2) {
                card.classList.add('right-2');
            } else {
                card.classList.add('hidden');
            }
        });

        // Update progress dots
        dots.forEach((dot, index) => {
            if (index === currentIndex) {
                dot.classList.add('active');
            } else {
                dot.classList.remove('active');
            }
        });
    }

    // Navigation
    prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + totalCards) % totalCards;
        updateCarousel();
    });

    nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % totalCards;
        updateCarousel();
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
            currentIndex = (currentIndex - 1 + totalCards) % totalCards;
            updateCarousel();
        } else if (e.key === 'ArrowRight') {
            currentIndex = (currentIndex + 1) % totalCards;
            updateCarousel();
        }
    });

    // Touch/Swipe support
    let touchStartX = 0;
    let touchEndX = 0;

    container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        const swipeThreshold = 50;
        if (touchEndX < touchStartX - swipeThreshold) {
            // Swipe left
            currentIndex = (currentIndex + 1) % totalCards;
            updateCarousel();
        }
        if (touchEndX > touchStartX + swipeThreshold) {
            // Swipe right
            currentIndex = (currentIndex - 1 + totalCards) % totalCards;
            updateCarousel();
        }
    }

    // Initialize
    updateCarousel();

    // Optional: Auto-play (uncomment to enable)
    // setInterval(() => {
    //     currentIndex = (currentIndex + 1) % totalCards;
    //     updateCarousel();
    // }, 5000);
});
</script>
