<!-- The Technology Behind Our Work Section -->
<section id="technology-behind-section" class="py-20 lg:py-28 bg-white">
    <div class="container mx-auto px-4 lg:px-8">
        <!-- Section Header -->
        <div class="flex flex-col gap-6 items-center mb-16">
            <!-- Title -->
            <h2 class="text-4xl lg:text-5xl xl:text-[64px] font-semibold leading-tight lg:leading-[80px] tracking-[-2.56px] text-center text-dark max-w-[783px]">
                The <span class="text-primary">Technology</span> Behind Our Work
            </h2>

            <!-- Tab Pills -->
            <div class="inline-flex bg-[#F5F5F5] rounded-full px-4 py-3 gap-6 overflow-x-auto max-w-full">
                <button class="tech-tab active bg-[#1DBF73] text-white shadow-[0px_6px_12px_0px_rgba(0,0,0,0.16)] px-6 py-3 rounded-full text-base font-normal tracking-[-0.32px] transition-all duration-300 whitespace-nowrap" data-tab="designing">
                    Designing
                </button>
                <button class="tech-tab bg-white text-[#707070] px-6 py-3 rounded-full text-base font-normal tracking-[-0.32px] transition-all duration-300 hover:bg-gray-50 whitespace-nowrap" data-tab="frontend">
                    Frontend
                </button>
                <button class="tech-tab bg-white text-[#707070] px-6 py-3 rounded-full text-base font-normal tracking-[-0.32px] transition-all duration-300 hover:bg-gray-50 whitespace-nowrap" data-tab="backend">
                    Backend
                </button>
                <button class="tech-tab bg-white text-[#707070] px-6 py-3 rounded-full text-base font-normal tracking-[-0.32px] transition-all duration-300 hover:bg-gray-50 whitespace-nowrap" data-tab="database">
                    Database
                </button>
                <button class="tech-tab bg-white text-[#707070] px-6 py-3 rounded-full text-base font-normal tracking-[-0.32px] transition-all duration-300 hover:bg-gray-50 whitespace-nowrap" data-tab="cloud">
                    Cloud
                </button>
            </div>
        </div>

        <!-- Technology Logos Container -->
        <div class="max-w-[810px] mx-auto min-h-[300px] flex items-center justify-center">
            <!-- Designing Tab Content -->
            <div class="tech-content active" data-content="designing">
                <div class="flex flex-col items-center gap-8">
                    <!-- First Row -->
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/Group.svg" alt="HTML5" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/css.svg" alt="CSS3" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/js.svg" alt="JavaScript" class="h-16 lg:h-20 w-auto tech-logo">
                    </div>
                    <!-- Second Row -->
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/web.svg" alt="WebAssembly" class="h-14 lg:h-16 w-auto tech-logo">
                        <img src="assets/icons/technology/ts.svg" alt="TypeScript" class="h-14 lg:h-16 w-auto tech-logo">
                    </div>
                </div>
            </div>

            <!-- Frontend Tab Content -->
            <div class="tech-content hidden" data-content="frontend">
                <div class="flex flex-col items-center gap-8">
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/Group.svg" alt="HTML5" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/css.svg" alt="CSS3" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/js.svg" alt="JavaScript" class="h-16 lg:h-20 w-auto tech-logo">
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/ts.svg" alt="TypeScript" class="h-14 lg:h-16 w-auto tech-logo">
                        <img src="assets/icons/technology/GroupBlue.svg" alt="React" class="h-14 lg:h-16 w-auto tech-logo">
                    </div>
                </div>
            </div>

            <!-- Backend Tab Content -->
            <div class="tech-content hidden" data-content="backend">
                <div class="flex flex-col items-center gap-8">
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/js.svg" alt="Node.js" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/ts.svg" alt="TypeScript" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/Vector.svg" alt="Python" class="h-16 lg:h-20 w-auto tech-logo">
                    </div>
                </div>
            </div>

            <!-- Database Tab Content -->
            <div class="tech-content hidden" data-content="database">
                <div class="flex flex-col items-center gap-8">
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/GroupBlue.svg" alt="PostgreSQL" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/Vector.svg" alt="MongoDB" class="h-16 lg:h-20 w-auto tech-logo">
                    </div>
                </div>
            </div>

            <!-- Cloud Tab Content -->
            <div class="tech-content hidden" data-content="cloud">
                <div class="flex flex-col items-center gap-8">
                    <div class="flex flex-wrap items-center justify-center gap-10 lg:gap-16">
                        <img src="assets/icons/technology/GroupBlue.svg" alt="AWS" class="h-16 lg:h-20 w-auto tech-logo">
                        <img src="assets/icons/technology/Vector.svg" alt="Docker" class="h-16 lg:h-20 w-auto tech-logo">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- GSAP Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    gsap.registerPlugin(ScrollTrigger);

    const tabs = document.querySelectorAll('.tech-tab');
    const contents = document.querySelectorAll('.tech-content');

    // Tab switching functionality
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            const targetTab = this.dataset.tab;

            // Update tab styles
            tabs.forEach(t => {
                t.classList.remove('active', 'bg-[#1DBF73]', 'text-white', 'shadow-[0px_6px_12px_0px_rgba(0,0,0,0.16)]');
                t.classList.add('bg-white', 'text-[#707070]');
            });

            this.classList.remove('bg-white', 'text-[#707070]');
            this.classList.add('active', 'bg-[#1DBF73]', 'text-white', 'shadow-[0px_6px_12px_0px_rgba(0,0,0,0.16)]');

            // Show/hide content with animation
            contents.forEach(content => {
                if (content.dataset.content === targetTab) {
                    content.classList.remove('hidden');
                    gsap.fromTo(content.querySelectorAll('.tech-logo'),
                        { opacity: 0, y: 30, scale: 0.8 },
                        {
                            opacity: 1,
                            y: 0,
                            scale: 1,
                            duration: 0.5,
                            stagger: 0.1,
                            ease: 'back.out(1.4)'
                        }
                    );
                } else {
                    content.classList.add('hidden');
                }
            });
        });
    });

    // Initial animation on scroll
    gsap.from('#technology-behind-section h2', {
        scrollTrigger: {
            trigger: '#technology-behind-section',
            start: 'top 80%',
            once: true
        },
        y: 60,
        opacity: 0,
        duration: 1,
        ease: 'power3.out'
    });

    gsap.from('.tech-tab', {
        scrollTrigger: {
            trigger: '#technology-behind-section',
            start: 'top 80%',
            once: true
        },
        y: 30,
        opacity: 0,
        duration: 0.6,
        stagger: 0.1,
        delay: 0.3,
        ease: 'power2.out'
    });

    gsap.from('.tech-content.active .tech-logo', {
        scrollTrigger: {
            trigger: '#technology-behind-section',
            start: 'top 70%',
            once: true
        },
        y: 50,
        opacity: 0,
        scale: 0.8,
        duration: 0.6,
        stagger: 0.1,
        delay: 0.5,
        ease: 'back.out(1.4)'
    });
});
</script>
