<style>
.orb-bg {
    position: absolute;
    border-radius: 50%;

.orb-2 {

}

.orb-3 {
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, #f093fb, transparent);
    bottom: -10%;
    left: 40%;
    animation: float 22s infinite;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(50px, -50px); }
    66% { transform: translate(-30px, 30px); }
}

.carousel-wrapper {
    position: relative;
    padding: 20px 0;
    cursor: grab;
}

.carousel-wrapper:active {
    cursor: grabbing;
}

    will-change: transform;
}

    flex: 0 0 auto;
    width: 90vw;

}

@media (min-width: 768px) {
    .project-card {
        width: 70vw;
        max-width: 900px;
    }
}

@media (min-width: 1024px) {
    .project-card {
        width: 50vw;
        max-width: 800px;
    }
}

.case-card-wrapper {
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
}

.case-card-wrapper:hover {
    transform: translateY(-10px);
}

.phone-mockups-container {
    perspective: 1000px;
    transform-style: preserve-3d;
}

.phone-mockup {
    width: 280px;
    height: 560px;
    transition: transform 0.6s ease;
    will-change: transform;
}

@media (max-width: 1024px) {
    .phone-mockup {
        width: 220px;
        height: 440px;
    }
}

.phone-mockup img {
    filter: brightness(1.05) contrast(1.1);
}

/* Phone positions */
.phone-center {
    left: 50%;
    top: 50%;
    z-index: 3;
}

.phone-left {
    left: 15%;
    top: 45%;
    z-index: 1;
    opacity: 0.7;
}

.phone-right {
    right: 5%;
    top: 55%;
    z-index: 2;
    opacity: 0.6;
}

/* Phone animations */
.phone-center {
    animation: floatPhoneCenter 4s ease-in-out infinite;
}

.phone-left {
    animation: floatPhoneLeft 5s ease-in-out infinite;
}

.phone-right {
    animation: floatPhoneRight 4.5s ease-in-out infinite;
}

@keyframes floatPhoneCenter {
    0%, 100% {
        transform: translate(-50%, -50%) rotate(-5deg) scale(1.1);
    }
    50% {
        transform: translate(-50%, calc(-50% - 15px)) rotate(-3deg) scale(1.1);
    }
}

@keyframes floatPhoneLeft {
    0%, 100% {
        transform: translate(-50%, -50%) rotate(-12deg) scale(0.85);
    }
    50% {
        transform: translate(-50%, calc(-50% - 20px)) rotate(-15deg) scale(0.85);
    }
}

@keyframes floatPhoneRight {
    0%, 100% {
        transform: translate(0, -50%) rotate(8deg) scale(0.75);
    }
    50% {
        transform: translate(0, calc(-50% - 10px)) rotate(11deg) scale(0.75);
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const caseStudies = [
        {
            id: 'artify',
            title: 'Artify',
            subtitle: 'Digital Art Marketplace',
            category: 'Social',
            images: [
                './assets/casestudy/artify/csh5.svg',
                './assets/casestudy/artify/csh2.svg',
                './assets/casestudy/artify/csh3.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-detail.php'
        },
        {
            id: 'myshare',
            title: 'My Share',
            subtitle: 'Fitness Tracking & Wellness',
            category: 'Health & Fitness',
            images: [
                './assets/casestudy/myshare/cs1.svg',
                './assets/casestudy/myshare/cs2.svg',
                './assets/casestudy/myshare/cs3.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-myshare.php'
        },
        {
            id: 'vapix',
            title: 'Vapix',
            subtitle: 'Smart Shopping Experience',
            category: 'E-Commerce',
            images: [
                './assets/casestudy/nimbus/cs1.svg',
                './assets/casestudy/nimbus/cs2.svg',
                './assets/casestudy/nimbus/cs4.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-nimbus.php'
        },
        {
            id: 'prospera',
            title: 'Prospera',
            subtitle: 'Carbon Registry Platform',
            category: 'CleanTech',
            images: [
                './assets/casestudy/prospera/cs5.svg',
                './assets/casestudy/prospera/cs2.svg',
                './assets/casestudy/prospera/cs3.svg'
            ],
            tags: ['Web App', 'React', 'Node.js'],
            link: './case-studies/case-study-prospera.php'
        },
        {
            id: 'collabify',
            title: 'Collabify',
            subtitle: 'Team Collaboration Platform',
            category: 'Social',
            images: [
                './assets/casestudy/collabify/cs1.svg',
                './assets/casestudy/collabify/cs2.svg',
                './assets/casestudy/collabify/cs4.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-collabify.php'
        },
        {
            id: 'cta',
            type: 'cta',
            title: 'Your App Idea Starts Here',
            description: 'Join 50+ businesses that launched successful mobile apps with GlideUps',
            link: '#contact-section'
        }
    ];

    const carouselTrack = document.getElementById('carousel-track');

    // Generate cards
    caseStudies.forEach((study, index) => {
        const card = document.createElement('div');
        card.className = 'project-card';

        if (study.type === 'cta') {
            card.innerHTML = `
                <div class="bg-gradient-to-br from-primary via-purple-600 to-pink-600 rounded-3xl lg:rounded-[40px] p-12 lg:p-16 text-center relative overflow-hidden">
                    <div class="absolute inset-0 opacity-10">
                        <div class="absolute inset-0" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 40px 40px;"></div>
                    </div>
                    <div class="relative z-10">
                        <div class="text-6xl lg:text-8xl mb-6">🚀</div>
                        <h3 class="text-3xl lg:text-5xl font-black text-white mb-4 leading-tight">${study.title}</h3>
                        <p class="text-lg lg:text-xl text-white/90 mb-8">
                            ${study.description}
                        </p>
                        <a href="${study.link}" class="inline-flex items-center px-8 py-4 bg-white/20 backdrop-blur-xl border border-white/30 text-white rounded-2xl font-bold hover:bg-white/30 hover:scale-105 transition-all">
                            Start Your Project →
                        </a>
                    </div>
                </div>
            `;
        } else {
            card.innerHTML = `
                <div class="case-card-wrapper rounded-3xl lg:rounded-[40px] overflow-hidden" style="background: linear-gradient(135deg, #000000 0%, #0a192f 50%, #0a3d62 100%);">
                    <div class="absolute inset-0 opacity-5">
                        <div class="absolute inset-0" style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px;"></div>
                    </div>

                    <div class="grid lg:grid-cols-2 gap-8 lg:gap-12 items-center relative z-10">
                        <div class="p-8 lg:p-12 order-2 lg:order-1">
                            <h3 class="text-3xl lg:text-5xl font-black text-white mb-4 leading-tight">
                                ${study.title}
                            </h3>
                            <p class="text-base lg:text-lg text-gray-300 mb-6 leading-relaxed">
                                ${study.subtitle}. ${study.category} application built with modern technologies.
                            </p>
                            <a href="${study.link}" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-xl font-bold hover:from-purple-700 hover:to-blue-700 hover:scale-105 transition-all shadow-lg shadow-purple-500/30">
                                Read case study →
                            </a>
                        </div>

                        <div class="phone-mockups-container relative h-[350px] lg:h-[450px] order-1 lg:order-2">
                            <div class="phone-mockup phone-center absolute">
                                <img src="${study.images[0]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-2xl">
                            </div>
                            <div class="phone-mockup phone-left absolute">
                                <img src="${study.images[1]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                            </div>
                            <div class="phone-mockup phone-right absolute">
                                <img src="${study.images[2]}" alt="${study.title}" class="w-full h-full object-contain drop-shadow-xl">
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        carouselTrack.appendChild(card);
    });

    // Duplicate cards for infinite scroll effect
    const cards = Array.from(carouselTrack.children);
    cards.forEach(card => {
        const clone = card.cloneNode(true);
        carouselTrack.appendChild(clone);
    });

    // Auto-scroll animation
    let scrollPosition = 0;
    let animationId;
    let isPaused = false;

    function autoScroll() {
        if (!isPaused) {
            scrollPosition += 0.5; // Adjust speed here
            carouselTrack.style.transform = `translateX(-${scrollPosition}px)`;

            // Reset position when first set of cards is out of view
            const trackWidth = carouselTrack.scrollWidth / 2;
            if (scrollPosition >= trackWidth) {
                scrollPosition = 0;
            }
        }
        animationId = requestAnimationFrame(autoScroll);
    }

    // Pause on hover
    carouselTrack.addEventListener('mouseenter', () => {
        isPaused = true;
    });

    carouselTrack.addEventListener('mouseleave', () => {
        isPaused = false;
    });

    // Start auto-scroll
    autoScroll();
});
</script>
