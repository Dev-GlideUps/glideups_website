<!-- GSAP Animation -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        gsap.registerPlugin(ScrollTrigger);

        const title = document.getElementById('tech-title');
        const tabs = document.querySelectorAll('.tech-tab');
        const contents = document.querySelectorAll('.tech-content');

        // Title animation
        gsap.from(title, {
            scrollTrigger: {
                trigger: title,
                start: 'top 85%',
                once: true
            },
            y: 60,
            opacity: 0,
            duration: 1,
            ease: 'power3.out'
        });

        // Tabs entrance animation
        gsap.from(tabs, {
            scrollTrigger: {
                trigger: '#tech-tabs',
                start: 'top 85%',
                once: true
            },
            y: 30,
            opacity: 0,
            duration: 0.6,
            stagger: 0.1,
            ease: 'back.out(1.4)'
        });

        // Initial content animation
        function animateContent(content) {
            const icons = content.querySelectorAll('.tech-icon-item');
            gsap.fromTo(icons,
                { y: 40, opacity: 0, scale: 0.8 },
                {
                    y: 0,
                    opacity: 1,
                    scale: 1,
                    duration: 0.5,
                    stagger: 0.1,
                    ease: 'back.out(1.4)'
                }
            );
        }

        // Animate initial content
        const activeContent = document.querySelector('.tech-content.active');
        if (activeContent) {
            gsap.from(activeContent.querySelectorAll('.tech-icon-item'), {
                scrollTrigger: {
                    trigger: activeContent,
                    start: 'top 85%',
                    once: true
                },
                y: 40,
                opacity: 0,
                scale: 0.8,
                duration: 0.5,
                stagger: 0.1,
                ease: 'back.out(1.4)'
            });
        }

        // Tab click handler
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const tabId = this.getAttribute('data-tab');

                // Update active states
                tabs.forEach(t => {
                    t.classList.remove('active', 'bg-primary', 'text-white');
                    t.classList.add('bg-gray-light', 'text-dark');
                });

                this.classList.add('active', 'bg-primary', 'text-white');
                this.classList.remove('bg-gray-light', 'text-dark');

                // Hide all contents with animation
                contents.forEach(content => {
                    if (!content.classList.contains('hidden')) {
                        gsap.to(content.querySelectorAll('.tech-icon-item'), {
                            y: -20,
                            opacity: 0,
                            scale: 0.9,
                            duration: 0.3,
                            stagger: 0.05,
                            ease: 'power2.in',
                            onComplete: () => {
                                content.classList.add('hidden');
                                content.classList.remove('active');

                                // Show new content
                                const newContent = document.getElementById(`${tabId}-content`);
                                newContent.classList.remove('hidden');
                                newContent.classList.add('active');
                                animateContent(newContent);
                            }
                        });
                    }
                });
            });

            // Tab hover effect
            tab.addEventListener('mouseenter', function() {
                if (!this.classList.contains('active')) {
                    gsap.to(this, {
                        scale: 1.05,
                        duration: 0.2
                    });
                }
            });

            tab.addEventListener('mouseleave', function() {
                gsap.to(this, {
                    scale: 1,
                    duration: 0.2
                });
            });
        });

        // Tech icon hover effects
        document.querySelectorAll('.tech-icon-item').forEach(item => {
            const iconBox = item.querySelector('div');
            const img = item.querySelector('img');

            item.addEventListener('mouseenter', () => {
                gsap.to(iconBox, {
                    y: -8,
                    boxShadow: '0 15px 30px rgba(29, 191, 115, 0.2)',
                    duration: 0.3,
                    ease: 'power2.out'
                });

                gsap.to(img, {
                    scale: 1.1,
                    duration: 0.3,
                    ease: 'power2.out'
                });
            });

            item.addEventListener('mouseleave', () => {
                gsap.to(iconBox, {
                    y: 0,
                    boxShadow: '0 0 0 rgba(29, 191, 115, 0)',
                    duration: 0.3,
                    ease: 'power2.out'
                });

                gsap.to(img, {
                    scale: 1,
                    duration: 0.3,
                    ease: 'power2.out'
                });
            });
        });
    }
});
</script>
