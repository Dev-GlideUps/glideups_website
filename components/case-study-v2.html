<!-- Case Studies V2 - Horizontal Auto-Scrolling Carousel -->
<section class="case-studies-section relative py-20 lg:py-32" style="background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);">

    <!-- Background Effects -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="orb-bg orb-1"></div>
        <div class="orb-bg orb-2"></div>
        <div class="orb-bg orb-3"></div>
    </div>

    <!-- Content Container -->
    <div class="relative z-10">

        <!-- Section Header -->
        <div class="text-center mb-16">
            <h2 class="text-5xl lg:text-7xl font-black text-white mb-4">Our Work</h2>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto">Apps we've built for our clients</p>
        </div>

        <!-- Carousel Container -->
        <div class="carousel-wrapper overflow-hidden">
            <div class="carousel-track flex gap-6 lg:gap-8" id="carousel-track">
                <!-- Cards generated dynamically -->
            </div>
        </div>

    </div>
</section>

<style>
.carousel-wrapper {
    position: relative;
    padding: 20px 0;
}

.carousel-track {
    will-change: transform;
    transition: transform 0.3s ease-out;
}

.carousel-track:hover {
    animation-play-state: paused !important;
}

.project-card {
    flex: 0 0 auto;
    width: 90vw;
    max-width: 1000px;
}

@media (min-width: 768px) {
    .project-card {
        width: 70vw;
        max-width: 900px;
    }
}

@media (min-width: 1024px) {
    .project-card {
        width: 50vw;
        max-width: 800px;
    }
}

.orb-bg {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
}

.orb-1 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #1dbf73, transparent);
    top: -10%;
    left: -10%;
    animation: float 20s infinite;
}

.orb-2 {
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, #667eea, transparent);
    top: 50%;
    right: -10%;
    animation: float 25s infinite reverse;
}

.orb-3 {
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, #f093fb, transparent);
    bottom: -10%;
    left: 40%;
    animation: float 22s infinite;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(50px, -50px); }
    66% { transform: translate(-30px, 30px); }
}

@keyframes floatPhoneCenter {
    0%, 100% {
        transform: translate(-50%, -50%) rotate(-5deg) scale(1.1);
    }
    50% {
        transform: translate(-50%, calc(-50% - 15px)) rotate(-3deg) scale(1.1);
    }
}

@keyframes floatPhoneLeft {
    0%, 100% {
        transform: translate(-50%, -50%) rotate(-12deg) scale(0.85);
    }
    50% {
        transform: translate(-50%, calc(-50% - 20px)) rotate(-15deg) scale(0.85);
    }
}

@keyframes floatPhoneRight {
    0%, 100% {
        transform: translate(0, -50%) rotate(8deg) scale(0.75);
    }
    50% {
        transform: translate(0, calc(-50% - 10px)) rotate(11deg) scale(0.75);
    }
}

/* Auto-scroll animation */
@keyframes autoScroll {
    0% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(calc(-100% - 2rem));
    }
}

.case-card-wrapper {
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.phone-mockups-container {
    perspective: 1000px;
    transform-style: preserve-3d;
}

.phone-mockup {
    width: 280px;
    height: 560px;
    transition: transform 0.6s ease;
    will-change: transform;
}

@media (max-width: 1024px) {
    .phone-mockup {
        width: 220px;
        height: 440px;
    }
}

.phone-mockup img {
    filter: brightness(1.05) contrast(1.1);
}

/* Phone positions */
.phone-center {
    left: 50%;
    top: 50%;
    z-index: 3;
}

.phone-left {
    left: 15%;
    top: 45%;
    z-index: 1;
    opacity: 0.7;
}

.phone-right {
    right: 5%;
    top: 55%;
    z-index: 2;
    opacity: 0.6;
}

/* Phone animations with base transforms */
.phone-center {
    animation: floatPhoneCenter 4s ease-in-out infinite;
}

.phone-left {
    animation: floatPhoneLeft 5s ease-in-out infinite;
}

.phone-right {
    animation: floatPhoneRight 4.5s ease-in-out infinite;
}

/* Initial state for WORK title - prevents flash */
#work-title {
    transform: scale(0.2) translateY(-400px);
    opacity: 0;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    gsap.registerPlugin(ScrollTrigger);

    // Your case studies data
    const caseStudies = [
          {
            id: 'artify',
            title: 'Artify',
            subtitle: 'Digital Art Marketplace',
            category: 'Social',
            images: [
                './assets/casestudy/artify/csh5.svg',
                './assets/casestudy/artify/csh2.svg',
                './assets/casestudy/artify/csh3.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-detail.php'
        },
        {
            id: 'myshare',
            title: 'My Share',
            subtitle: 'Fitness Tracking & Wellness',
            category: 'Health & Fitness',
            images: [
                './assets/casestudy/myshare/cs1.svg',
                './assets/casestudy/myshare/cs2.svg',
                './assets/casestudy/myshare/cs3.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-myshare.php'
        },
        {
            id: 'vapix',
            title: 'Vapix',
            subtitle: 'Smart Shopping Experience',
            category: 'E-Commerce',
            images: [
                './assets/casestudy/nimbus/cs1.svg',
                './assets/casestudy/nimbus/cs2.svg',
                './assets/casestudy/nimbus/cs4.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-nimbus.php'
        },
        {
            id: 'artify',
            title: 'Artify',
            subtitle: 'Digital Art Marketplace',
            category: 'Social',
            images: [
                './assets/casestudy/artify/csh5.svg',
                './assets/casestudy/artify/csh2.svg',
                './assets/casestudy/artify/csh3.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-detail.php'
        },
        {
            id: 'prospera',
            title: 'Prospera',
            subtitle: 'Carbon Registry Platform',
            category: 'CleanTech',
            images: [
                './assets/casestudy/prospera/cs5.svg',
                './assets/casestudy/prospera/cs2.svg',
                './assets/casestudy/prospera/cs3.svg'
            ],
            tags: ['Web App', 'React', 'Node.js'],
            link: './case-studies/case-study-prospera.php'
        },
        {
            id: 'collabify',
            title: 'Collabify',
            subtitle: 'Team Collaboration Platform',
            category: 'Social',
            images: [
                './assets/casestudy/collabify/cs1.svg',
                './assets/casestudy/collabify/cs2.svg',
                './assets/casestudy/collabify/cs4.svg'
            ],
            tags: ['iOS', 'Android', 'Flutter'],
            link: './case-studies/case-study-collabify.php'
        },
        {
            id: 'cta',
            type: 'cta',
            title: 'Your App Idea Starts Here',
            description: 'Join 50+ businesses that launched successful mobile apps with GlideUps',
            image: './assets/cta-vector.svg',
            link: '#contact-section'
        }
    ];

    const cardsHolder = document.getElementById('cards-holder');
    const navDots = document.getElementById('nav-dots');
    const scrollContainer = document.querySelector('.scroll-container');
    const workTitle = document.getElementById('work-title');

    // Set initial position for WORK title (hidden at top, small)
    gsap.set(workTitle, {
        scale: 0.2,
        y: -400,
        opacity: 0
    });

    // Set scroll container height based on number of cards
    scrollContainer.style.height = `${caseStudies.length * 100}vh`;

    // Generate cards
    caseStudies.forEach((study, index) => {
        // Create card
        const card = document.createElement('div');
        card.className = 'project-card';
        card.setAttribute('data-index', index);

        if (study.type === 'cta') {
            // CTA Card
            card.innerHTML = `
                <div class="max-w-7xl mx-auto w-full px-6 lg:px-8">
                    <div class="bg-gradient-to-br from-primary via-purple-600 to-pink-600 rounded-3xl lg:rounded-[40px] p-12 lg:p-20 text-center overflow-hidden relative">
                        <div class="absolute inset-0 opacity-10">
                            <div class="absolute inset-0" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 40px 40px;"></div>
                        </div>
                        <div class="relative z-10">
                            <div class="text-6xl lg:text-8xl mb-6">🚀</div>
                            <h3 class="text-4xl lg:text-6xl font-black text-white mb-6 leading-tight">${study.title}</h3>
                            <p class="text-xl lg:text-2xl text-white/90 mb-12 max-w-2xl mx-auto leading-relaxed">
                                ${study.description}
                            </p>
                            <a href="${study.link}" class="inline-flex items-center px-10 py-5 bg-white/20 backdrop-blur-xl border border-white/30 text-white rounded-2xl font-bold text-lg hover:bg-white/30 hover:scale-105 transition-all">
                                Start Your Project →
                            </a>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // Regular Project Card - Gupi Style
            card.innerHTML = `
                <div class="max-w-7xl mx-auto w-full px-6 lg:px-8">
                    <div class="case-card-wrapper rounded-3xl lg:rounded-[40px] overflow-hidden relative" style="background: linear-gradient(135deg, #000000 0%, #0a192f 50%, #0a3d62 100%);">
                        <!-- Subtle grid pattern -->
                        <div class="absolute inset-0 opacity-5">
                            <div class="absolute inset-0" style="background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px;"></div>
                        </div>

                        <div class="grid lg:grid-cols-2 gap-8 lg:gap-12 items-center relative z-10">
                            <!-- Left: Content -->
                            <div class="p-8 lg:p-16 order-2 lg:order-1">
                                <h3 class="text-4xl lg:text-6xl font-black text-white mb-6 leading-tight tracking-tight">
                                    ${study.title}
                                </h3>
                                <p class="text-lg lg:text-xl text-gray-300 mb-8 leading-relaxed max-w-xl">
                                    ${study.subtitle}. ${study.category} application built with modern technologies to deliver exceptional user experience and performance.
                                </p>
                                <a href="${study.link}" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-xl font-bold text-base hover:from-purple-700 hover:to-blue-700 hover:scale-105 transition-all shadow-lg shadow-purple-500/30">
                                    Read the case study →
                                </a>
                            </div>

                            <!-- Right: Floating Phone Mockups -->
                            <div class="phone-mockups-container relative h-[400px] lg:h-[500px] order-1 lg:order-2">
                                <!-- Main phone (center) -->
                                <div class="phone-mockup phone-center absolute">
                                    <img src="${study.images[0]}"
                                         alt="${study.title} mockup 1"
                                         class="w-full h-full object-contain drop-shadow-2xl"
                                         onerror="this.src='https://via.placeholder.com/300x600/1a1a2e/1dbf73?text=${encodeURIComponent(study.title)}'">
                                </div>

                                <!-- Left phone (background) -->
                                <div class="phone-mockup phone-left absolute">
                                    <img src="${study.images[1]}"
                                         alt="${study.title} mockup 2"
                                         class="w-full h-full object-contain drop-shadow-xl"
                                         onerror="this.src='https://via.placeholder.com/300x600/1a1a2e/1dbf73?text=${encodeURIComponent(study.title)}'">
                                </div>

                                <!-- Right phone (background) -->
                                <div class="phone-mockup phone-right absolute">
                                    <img src="${study.images[2]}"
                                         alt="${study.title} mockup 3"
                                         class="w-full h-full object-contain drop-shadow-xl"
                                         onerror="this.src='https://via.placeholder.com/300x600/1a1a2e/1dbf73?text=${encodeURIComponent(study.title)}'">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        cardsHolder.appendChild(card);

        // Create nav dot
        const dot = document.createElement('div');
        dot.className = 'nav-dot';
        if (index === 0) dot.classList.add('active');
        navDots.appendChild(dot);
    });

    const cards = document.querySelectorAll('.project-card');
    const dots = document.querySelectorAll('.nav-dot');
    const numCards = cards.length;

    // First card will show after WORK text animation completes
    // Don't show immediately

    // Animate "WORK" text as user approaches section
    // Animation starts while still in services section and completes when case study section is centered
    gsap.to(workTitle, {
        scale: 1,
        y: 0,
        opacity: 0.1,
        ease: 'power2.out',
        scrollTrigger: {
            trigger: '.case-studies-section',
            start: 'top bottom', // Start animation when section enters viewport
            end: 'top center', // Complete when section is centered
            scrub: 1.5,
            markers: false
        }
    });

    // Create ScrollTrigger for card transitions
    let lastCardIndex = 0;
    ScrollTrigger.create({
        trigger: '.scroll-container',
        start: 'top top',
        end: 'bottom bottom',
        onUpdate: (self) => {
            const progress = self.progress;
            // Add threshold - card only changes when past 30% of its section
            const rawIndex = progress * numCards;
            const threshold = 0.3; // 30% threshold before switching
            const currentIndex = Math.min(
                Math.floor(rawIndex + threshold),
                numCards - 1
            );

            // Only update if card index actually changed
            if (currentIndex !== lastCardIndex) {
                lastCardIndex = currentIndex;
            }

            // Update cards with current index
            cards.forEach((card, index) => {
                if (index === lastCardIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            // Update dots with current index
            dots.forEach((dot, index) => {
                if (index === lastCardIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        },
        onLeave: () => {
            // Reset all cards when leaving section downward
            cards.forEach(card => {
                card.classList.remove('active');
                gsap.set(card, { scale: 0.9, y: 50 });
            });
        },
        onLeaveBack: () => {
            // Reset all cards when leaving section upward
            cards.forEach(card => {
                card.classList.remove('active');
                gsap.set(card, { scale: 0.9, y: 50 });
            });
        }
    });

    // Progress bar
    gsap.to('.progress-bar', {
        scrollTrigger: {
            trigger: '.scroll-container',
            start: 'top top',
            end: 'bottom bottom',
            scrub: true
        },
        scaleX: 1
    });

    // Add GSAP animations for card transitions
    cards.forEach((card, index) => {
        gsap.set(card, { scale: 0.9, y: 50 });

        // Only first card gets a delay after WORK text animation completes
        const cardDelay = index === 0 ? 0.8 : 0;

        ScrollTrigger.create({
            trigger: '.scroll-container',
            start: () => `top+=${(index / numCards) * 100}% top`,
            end: () => `top+=${((index + 1) / numCards) * 100}% top`,
            onEnter: () => {
                gsap.to(card, {
                    scale: 1,
                    y: 0,
                    duration: 2,
                    ease: 'back.out(1.4)',
                    delay: cardDelay
                });
            },
            onLeave: () => {
                gsap.to(card, { scale: 0.9, y: -50, duration: 0.5 });
            },
            onEnterBack: () => {
                gsap.to(card, {
                    scale: 1,
                    y: 0,
                    duration: 0.8,
                    ease: 'back.out(1.4)',
                    delay: cardDelay
                });
            },
            onLeaveBack: () => {
                gsap.to(card, { scale: 0.9, y: 50, duration: 0.5 });
            }
        });
    });

    // Refresh ScrollTrigger to recalculate positions after all setup
    setTimeout(() => {
        ScrollTrigger.refresh();
    }, 100);
});
</script>
