<!-- Food Delivery Hero Section -->
<section class="relative flex items-center pt-24 pb-16 lg:pt-32 lg:pb-20">
    <!-- Background Image with Dark Overlay -->
    <div class="absolute inset-0 w-full h-full z-0">
        <img src="assets/food/hero-bg.svg" alt="" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40"></div>
    </div>

    <!-- Hero Content -->
    <div class="container mx-auto px-4 lg:px-8 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-center">
            <!-- Left Content -->
            <div class="max-w-[500px]">
                <!-- Main Heading -->
                <h1 id="food-hero-title" class="text-4xl lg:text-5xl xl:text-[56px] font-semibold leading-tight lg:leading-[68px] tracking-[-2px] text-white mb-6">
                    Get Your Own Food Delivery App Clone
                </h1>

                <!-- Description -->
                <p id="food-hero-desc" class="text-base lg:text-lg leading-7 text-white/80 mb-8 max-w-[420px]">
                    We uses the latest technological methods to improve a business's image. Our services aim to give your brand that competitive edge that it needs to outshine in the competition – allowing you to be a step ahead.
                </p>

                <!-- CTA Buttons -->
                <div class="flex flex-wrap gap-4">
                    <!-- Schedule Meeting Button - Orange -->
                    <a href="#contact-section" class="food-hero-cta inline-flex items-center gap-2 px-6 py-3.5 rounded-full transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg" style="background-color: #F5A623; color: white;">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <span class="font-semibold">Schedule a Meeting</span>
                    </a>

                    <!-- WhatsApp Button - White with Green Border -->
                    <a href="https://wa.me/923032298414" target="_blank" class="food-hero-cta inline-flex items-center gap-2 px-6 py-3.5 rounded-full transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg" style="background-color: white; color: #25D366; border: 2px solid #25D366;">
                        <svg class="w-5 h-5" fill="#25D366" viewBox="0 0 24 24">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                        </svg>
                        <span class="font-semibold">Message on Whatsapp</span>
                    </a>
                </div>
            </div>

            <!-- Right - Phone Mockup -->
            <div class="flex justify-center lg:justify-end lg:pr-8 xl:pr-16">
                <div class="relative">
                    <!-- Orange Oval Shadow at Bottom - Using SVG (Behind phone) -->
                    <img
                        src="assets/food/Ellipse 2.svg"
                        alt=""
                        class="absolute bottom-0 left-1/3 w-[380px] lg:w-[580px] h-auto"
                        style="transform: translateX(-50%) translateY(20px);"
                    >

                    <!-- Phone Mockup Image (On top of shadow) -->
                    <div id="food-hero-phone" class="phone-mockup relative" style="transform: rotate(6deg);">
                        <img
                            src="assets/food/hero-modal.svg"
                            alt="Food Delivery App"
                            class="w-[220px] lg:w-[280px] h-auto"
                            style="filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.25));"
                        >
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- GSAP Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    gsap.registerPlugin(ScrollTrigger);

    const title = document.getElementById('food-hero-title');
    const desc = document.getElementById('food-hero-desc');
    const ctaButtons = document.querySelectorAll('.food-hero-cta');
    const phone = document.getElementById('food-hero-phone');

    // Timeline for hero entrance
    const heroTl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    heroTl
        .from(title, {
            y: 60,
            opacity: 0,
            duration: 1
        })
        .from(desc, {
            y: 40,
            opacity: 0,
            duration: 0.8
        }, '-=0.6')
        .from(ctaButtons, {
            y: 30,
            opacity: 0,
            duration: 0.6,
            stagger: 0.15
        }, '-=0.4')
        .from(phone, {
            x: 100,
            opacity: 0,
            duration: 1,
            ease: 'back.out(1.2)'
        }, '-=0.8');

    // Phone floating animation
    if (phone) {
        gsap.to(phone, {
            y: -15,
            duration: 3,
            ease: 'sine.inOut',
            yoyo: true,
            repeat: -1
        });
    }

    // Button hover effects
    ctaButtons.forEach(btn => {
        btn.addEventListener('mouseenter', () => {
            gsap.to(btn, {
                scale: 1.05,
                duration: 0.3
            });
        });

        btn.addEventListener('mouseleave', () => {
            gsap.to(btn, {
                scale: 1,
                duration: 0.3
            });
        });
    });
});
</script>
