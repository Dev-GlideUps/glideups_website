<!-- E-Commerce Your Idea CTA Section -->
<section class="py-20 lg:py-28 bg-white">
    <div class="container mx-auto px-4 lg:px-8">
        <div class="flex flex-col lg:flex-row gap-8 lg:gap-4 items-start">
            <!-- Left Content -->
            <div class="w-full lg:w-[592px] flex flex-col gap-3">
                <h2 class="text-4xl lg:text-5xl xl:text-[64px] font-semibold leading-tight lg:leading-[80px] tracking-[-2.56px] text-dark">
                    Your <span class="text-primary">E-Commerce</span><br>
                    Vision, Our Expertise
                </h2>
                <p class="text-base font-normal leading-6 tracking-[-0.32px] text-gray">
                    We build powerful e-commerce solutions for startups & enterprises with fair pricing, no hidden fees, and complete support. Get the online store your business deserves!
                </p>
            </div>

            <!-- Right Content - Contact Form -->
            <div class="w-full lg:w-[592px] bg-dark rounded-[40px] px-8 py-10 flex flex-col gap-10">
                <form id="ecommerceIdeaForm" class="flex flex-col gap-6">
                    <div class="flex flex-col gap-3">
                        <input type="text" name="name" class="w-full bg-transparent border-0 border-b border-white/20 text-white py-3 focus:outline-none focus:border-primary transition-colors placeholder:text-gray-light text-base" placeholder="Name" required>
                    </div>
                    <div class="flex flex-col gap-3">
                        <input type="email" name="email" class="w-full bg-transparent border-0 border-b border-white/20 text-white py-3 focus:outline-none focus:border-primary transition-colors placeholder:text-gray-light text-base" placeholder="Email" required>
                    </div>
                    <div class="flex flex-col gap-3">
                        <input type="tel" name="number" class="w-full bg-transparent border-0 border-b border-white/20 text-white py-3 focus:outline-none focus:border-primary transition-colors placeholder:text-gray-light text-base" placeholder="Number" required>
                    </div>
                    <div class="flex flex-col gap-3">
                        <textarea name="project" rows="2" class="w-full bg-transparent border-0 border-b border-white/20 text-white py-3 focus:outline-none focus:border-primary transition-colors placeholder:text-gray-light text-base resize-none" placeholder="Describe Your E-Commerce Project" required></textarea>
                    </div>
                    <button type="submit" class="w-full h-[60px] bg-primary hover:bg-primary-dark text-white text-2xl font-normal rounded-full transition-all duration-300 mt-4">
                        Submit
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
