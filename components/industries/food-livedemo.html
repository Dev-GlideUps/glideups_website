<style>
    /* 1st phone slides down from above, 2nd phone slides up from below — slow & gentle */
    #food-ld-front { opacity: 0; transform: translateY(-90px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.22,1,.36,1); }
    #food-ld-back  { opacity: 0; transform: translateY(90px);  transition: opacity 1s ease, transform 1.1s cubic-bezier(.22,1,.36,1); }
    #food-ld-front.ld-in, #food-ld-back.ld-in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        #food-ld-front, #food-ld-back { opacity: 1; transform: none; transition: none; }
    }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var stage = document.getElementById('food-ld-stage');
    var front = document.getElementById('food-ld-front');
    var back = document.getElementById('food-ld-back');
    if (!stage || !front || !back) return;
    if (reduce) { front.classList.add('ld-in'); back.classList.add('ld-in'); return; }

    var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            front.classList.add('ld-in');
            back.classList.add('ld-in');
            io.disconnect();
        });
    }, { threshold: 0.3 });
    io.observe(stage);
});
</script>
