

<!-- Let's Bring Your Idea Into Reality Section -->
<section id="contact-section" class="py-20 lg:py-28 bg-dark relative overflow-hidden">
    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute top-0 left-0 w-64 h-64 bg-secondary rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-secondary rounded-full blur-3xl"></div>
    </div>

    <div class="container mx-auto px-4 lg:px-8 relative z-10">
        <div class="max-w-[1000px] mx-auto">
            <!-- Section Header -->
            <div class="text-center mb-12">
                <h2 class="text-4xl lg:text-5xl xl:text-[56px] font-semibold leading-tight tracking-[-2.24px] text-white mb-4">
                    Let's Bring Your Idea<br>Into <span class="text-secondary">Reality</span>
                </h2>
                <p class="text-white/70 text-lg max-w-[600px] mx-auto">
                    Ready to launch your food delivery app? Fill out the form below and our team will get back to you within 24 hours.
                </p>
            </div>

            <!-- Contact Form -->
            <div class="bg-white/5 backdrop-blur-sm rounded-[32px] p-8 lg:p-12 border border-white/10">
                <form id="foodIdeaContactForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Name -->
                    <div>
                        <label class="block text-white/80 text-sm mb-2">Full Name</label>
                        <input type="text" name="name" class="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-4 text-white placeholder:text-white/40 focus:outline-none focus:border-secondary transition-colors" placeholder="John Doe" required>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-white/80 text-sm mb-2">Email Address</label>
                        <input type="email" name="email" class="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-4 text-white placeholder:text-white/40 focus:outline-none focus:border-secondary transition-colors" placeholder="john@example.com" required>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label class="block text-white/80 text-sm mb-2">Phone Number</label>
                        <input type="tel" name="phone" class="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-4 text-white placeholder:text-white/40 focus:outline-none focus:border-secondary transition-colors" placeholder="+1 (555) 000-0000">
                    </div>

                    <!-- Budget -->
                    <div>
                        <label class="block text-white/80 text-sm mb-2">Project Budget</label>
                        <select name="budget" class="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-secondary transition-colors">
                            <option value="" class="text-dark">Select budget range</option>
                            <option value="5k-10k" class="text-dark">$5,000 - $10,000</option>
                            <option value="10k-25k" class="text-dark">$10,000 - $25,000</option>
                            <option value="25k-50k" class="text-dark">$25,000 - $50,000</option>
                            <option value="50k+" class="text-dark">$50,000+</option>
                        </select>
                    </div>

                    <!-- Message -->
                    <div class="md:col-span-2">
                        <label class="block text-white/80 text-sm mb-2">Project Details</label>
                        <textarea name="message" rows="4" class="w-full bg-white/10 border border-white/20 rounded-xl px-5 py-4 text-white placeholder:text-white/40 focus:outline-none focus:border-secondary transition-colors resize-none" placeholder="Tell us about your food delivery app idea..." required></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="md:col-span-2 text-center">
                        <button type="submit" class="inline-flex items-center gap-2 bg-secondary hover:bg-secondary-dark text-white font-semibold px-10 py-4 rounded-full transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_10px_30px_rgba(245,166,35,0.4)]">
                            Send Message
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- GSAP Animation -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
        gsap.registerPlugin(ScrollTrigger);

        const foodIdeaContent = document.querySelector('.food-idea-content');
        const floatingCard1 = document.querySelector('.food-floating-card-1');
        const floatingCard2 = document.querySelector('.food-floating-card-2');
        const floatingCard3 = document.querySelector('.food-floating-card-3');

        // Content animation
        if (foodIdeaContent) {
            gsap.from(foodIdeaContent, {
                scrollTrigger: {
                    trigger: foodIdeaContent,
                    start: 'top 80%',
                    once: true
                },
                x: -60,
                opacity: 0,
                duration: 1,
                ease: 'power3.out'
            });
        }

        // Floating cards entrance
        if (floatingCard1) {
            gsap.from(floatingCard1, {
                scrollTrigger: {
                    trigger: floatingCard1,
                    start: 'top 85%',
                    once: true
                },
                y: 40,
                opacity: 0,
                duration: 0.8,
                ease: 'power3.out'
            });

            // Floating animation
            gsap.to(floatingCard1, {
                y: -10,
                duration: 2.5,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1
            });
        }

        if (floatingCard2) {
            gsap.from(floatingCard2, {
                scrollTrigger: {
                    trigger: floatingCard2,
                    start: 'top 85%',
                    once: true
                },
                y: 40,
                opacity: 0,
                duration: 0.8,
                delay: 0.2,
                ease: 'power3.out'
            });

            // Floating animation (opposite)
            gsap.to(floatingCard2, {
                y: 10,
                duration: 3,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1
            });
        }

        if (floatingCard3) {
            gsap.from(floatingCard3, {
                scrollTrigger: {
                    trigger: floatingCard3,
                    start: 'top 85%',
                    once: true
                },
                scale: 0.8,
                opacity: 0,
                duration: 0.8,
                delay: 0.4,
                ease: 'back.out(1.7)'
            });

            // Floating animation
            gsap.to(floatingCard3, {
                y: -15,
                rotation: 2,
                duration: 3.5,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1
            });
        }
    }
});
</script>
