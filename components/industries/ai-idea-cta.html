<!-- Your AI Idea CTA Section -->
<section class="py-20 lg:py-28 bg-white">
    <div class="container mx-auto px-4 lg:px-8">
        <div class="max-w-[1200px] mx-auto">
            <div class="flex flex-col lg:flex-row gap-10 lg:gap-16 items-center">
                <!-- Left Content -->
                <div class="lg:w-1/2">
                    <h2 class="text-4xl lg:text-5xl xl:text-[56px] font-semibold leading-tight lg:leading-[64px] tracking-[-2px] mb-6 text-dark">
                        Your <span class="text-primary">Idea</span><br>
                        Deserves Expert<br>
                        Execution
                    </h2>
                    <p class="text-gray text-sm lg:text-base leading-relaxed">
                        We build powerful apps for startups & SMBs with fair pricing, no hidden fees, and complete support. Get the results your business deserves!
                    </p>
                </div>

                <!-- Right - Contact Form -->
                <div class="lg:w-1/2 w-full">
                    <div class="bg-dark rounded-[24px] p-8 lg:p-10">
                        <form class="space-y-6">
                            <!-- Name Field -->
                            <div>
                                <input type="text" placeholder="Name" class="w-full bg-transparent border-b border-gray-600 text-white placeholder-white py-3 focus:outline-none focus:border-primary transition-colors">
                            </div>

                            <!-- Email Field -->
                            <div>
                                <input type="email" placeholder="Email" class="w-full bg-transparent border-b border-gray-600 text-white placeholder-white py-3 focus:outline-none focus:border-primary transition-colors">
                            </div>

                            <!-- Number Field -->
                            <div>
                                <input type="tel" placeholder="Number" class="w-full bg-transparent border-b border-gray-600 text-white placeholder-white py-3 focus:outline-none focus:border-primary transition-colors">
                            </div>

                            <!-- Project Description -->
                            <div>
                                <textarea placeholder="Describe Your Project" rows="3" class="w-full bg-transparent border-b border-gray-600 text-white placeholder-white py-3 focus:outline-none focus:border-primary transition-colors resize-none"></textarea>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 rounded-full transition-all duration-300 hover:shadow-[0_10px_30px_rgba(29,191,115,0.4)] mt-4">
                                Submit
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
